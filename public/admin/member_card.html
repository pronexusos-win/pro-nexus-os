<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Member Card & Referral Pass - Pro Nexus OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .display-font { font-family: 'Prompt', sans-serif; }
    .card-glass {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex flex-col items-center justify-center p-4">

  <main class="max-w-sm w-full space-y-4">

    <!-- บัตรสมาชิกดิจิทัล (Digital Membership Card) -->
    <div class="card-glass border-2 border-amber-400/40 rounded-3xl p-6 shadow-2xl space-y-5 text-center relative overflow-hidden">
      <!-- Glow Effect -->
      <div class="absolute -top-12 -right-12 w-36 h-36 bg-amber-500/20 rounded-full blur-3xl"></div>

      <!-- Header บัตร -->
      <div class="flex justify-between items-start border-b border-slate-800 pb-3">
        <div class="text-left">
          <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider block">PRO NEXUS MEMBER PASS</span>
          <h2 id="cardMemberName" class="display-font text-base font-bold text-white">คุณเมย์ สมาชิกคนพิเศษ</h2>
        </div>
        <span id="cardTierBadge" class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-amber-400 text-slate-950 shadow">
          VIP PASS
        </span>
      </div>

      <!-- QR Code กลางบัตร -->
      <div class="space-y-2">
        <div class="bg-white p-3.5 rounded-2xl w-56 h-56 mx-auto shadow-inner border-2 border-amber-400 flex items-center justify-center">
          <img id="cardQrImage" src="" alt="Member Referral QR" class="w-full h-full object-contain">
        </div>
        <div class="space-y-0.5">
          <span class="text-xs font-mono font-bold text-slate-300">รหัสสมาชิก: <b id="cardMemberCode" class="text-amber-400 text-sm">MEM-88899</b></span>
          <p class="text-[11px] text-slate-400">ยื่นให้เพื่อนสแกนสมัคร หรือพิมพ์ติดกล่องสินค้าได้ทันที</p>
        </div>
      </div>

      <!-- แถบสถิติชวนเพื่อน -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
        <div class="p-2 bg-slate-900/80 rounded-xl border border-slate-800">
          <span class="text-[10px] text-slate-400 block">สมาชิกที่คุณแนะนำ</span>
          <b id="cardTotalInvited" class="text-amber-400 text-base font-mono">14 คน</b>
        </div>
        <div class="p-2 bg-slate-900/80 rounded-xl border border-slate-800">
          <span class="text-[10px] text-slate-400 block">สิทธิประโยชน์</span>
          <b class="text-emerald-400 text-xs">รับคอมมิชชัน 5%</b>
        </div>
      </div>
    </div>

    <!-- ปุ่มควบคุมและคัดลอกลิงก์ -->
    <div class="space-y-2 text-xs">
      <div class="flex gap-2">
        <input type="text" id="directInviteLinkInput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 font-mono text-slate-300 text-[11px]">
        <button onclick="copyInviteLink()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl whitespace-nowrap transition shadow">
          คัดลอกลิงก์
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <a id="downloadQrBtn" href="" target="_blank" download="member-qr.png" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-center font-bold transition flex items-center justify-center gap-1">
          ⬇ บันทึกภาพ QR
        </a>
        <button onclick="window.print()" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-400/30 rounded-xl font-bold transition flex items-center justify-center gap-1">
          🏷️ พิมพ์สติกเกอร์สินค้า
        </button>
      </div>

      <div class="text-center pt-2">
        <a href="index.html" class="text-[11px] text-slate-500 hover:text-slate-400">← กลับสู่หน้าควบคุมระบบ</a>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = window.location.origin.includes('localhost') 
      ? 'http://localhost:8000' 
      : 'https://pro-nexus-os-production.up.railway.app';

    async function loadMemberCard() {
      // ดึงรหัสสมาชิกจาก URL เช่น ?code=MEM-88899 หรือใช้ค่า Default
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code') || 'MEM-88899';

      try {
        const res = await fetch(`${API_BASE}/api/v1/admin/member/digital-card?member_code=${code}&app_host=${window.location.origin}`);
        const data = await res.json();
        if (data.status === 'success') {
          document.getElementById('cardMemberName').innerText = data.full_name;
          document.getElementById('cardMemberCode').innerText = data.member_code;
          document.getElementById('cardTierBadge').innerText = `${data.tier_level} PASS`;
          document.getElementById('cardTotalInvited').innerText = `${data.total_invited} คน`;
          document.getElementById('cardQrImage').src = data.qr_code_url;
          document.getElementById('directInviteLinkInput').value = data.invite_link;
          document.getElementById('downloadQrBtn').href = data.qr_code_url;
        }
      } catch (err) {
        console.error("Load member card error:", err);
      }
    }

    function copyInviteLink() {
      const copyText = document.getElementById("directInviteLinkInput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("คัดลอกลิงก์สมัครสมาชิกเรียบร้อย! สามารถส่งทาง LINE หรือโพสต์ลงโซเชียลได้ทันที");
    }

    window.addEventListener('DOMContentLoaded', loadMemberCard);
  </script>
</body>
</html>

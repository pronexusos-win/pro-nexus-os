<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ Pro Nexus OS - RBAC Secure Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .display-font { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-amber-300 rounded-2xl flex items-center justify-center text-slate-950 text-2xl font-black mx-auto shadow-lg">
        🏛️
      </div>
      <h1 class="display-font text-xl font-black tracking-wide text-white">PRO NEXUS OS</h1>
      <p class="text-xs text-slate-400">ระบบเข้าสู่ระบบตามสิทธิ์การปฏิบัติงาน (COSO RBAC Gate)</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="text-slate-400 block mb-1.5 font-semibold">ชื่อผู้ใช้งาน (Username):</label>
        <input type="text" id="loginUsername" placeholder="เช่น cashier01, manager01, acc01" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 font-mono text-white text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="text-slate-400 block mb-1.5 font-semibold">รหัสผ่าน (Password):</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 font-mono text-white text-sm focus:outline-none focus:border-amber-400">
      </div>

      <div id="loginError" class="hidden p-3 bg-rose-950/80 border border-rose-600 rounded-xl text-rose-200 text-xs text-center font-semibold"></div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl transition shadow-lg text-sm">
        เข้าสู่ระบบตามสิทธิ์
      </button>
    </form>

    <div class="border-t border-slate-800 pt-4 space-y-2 text-[11px] text-slate-500">
      <b class="block text-slate-400">ตัวอย่างบัญชีทดสอบตามแผนก:</b>
      <div class="grid grid-cols-2 gap-1.5 font-mono text-[10px]">
        <span class="text-slate-400">• แคชเชียร์: <b class="text-slate-200">cashier01</b></span>
        <span class="text-slate-400">• ผจก.สาขา: <b class="text-slate-200">manager01</b></span>
        <span class="text-slate-400">• ฝ่ายบัญชี: <b class="text-slate-200">acc01</b></span>
        <span class="text-slate-400">• ฝ่ายบุคคล: <b class="text-slate-200">hr01</b></span>
        <span class="text-slate-400 col-span-2">• CFO/กรรมการตรวจสอบ: <b class="text-amber-400">cfo01</b></span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.includes('localhost') 
      ? 'http://localhost:8000' 
      : 'https://pro-nexus-os-production.up.railway.app';

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');

      try {
        const res = await fetch(`${API_BASE}/api/v1/admin/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
          // เก็บข้อมูล Session
          sessionStorage.setItem('pro_user', JSON.stringify(data.user));
          sessionStorage.setItem('admin_passcode', data.session_token);

          // นำทางไปยังหน้าแรกที่เหมาะสมตาม Role
          const role = data.user.role;
          if (role === 'CASHIER') {
            window.location.href = 'pos.html';
          } else if (role === 'BRANCH_MGR') {
            window.location.href = 'settlement.html';
          } else if (role === 'ACCOUNTING') {
            window.location.href = 'tax.html';
          } else if (role === 'HR_DPO') {
            window.location.href = 'hr.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          errBox.innerText = data.detail || 'เข้าสู่ระบบไม่สำเร็จ';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>

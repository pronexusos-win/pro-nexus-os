<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก Pro Nexus OS - Member Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .display-font { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl">
    <div class="text-center space-y-1">
      <div class="w-12 h-12 bg-amber-500 text-slate-950 rounded-2xl flex items-center justify-center text-xl font-black mx-auto">
        🤝
      </div>
      <h1 class="display-font text-xl font-black text-white">ลงทะเบียนสมาชิกใหม่</h1>
      <p class="text-xs text-slate-400">สแกนสมัครจากบัตรสมาชิกหรือบรรจุภัณฑ์สินค้า</p>
    </div>

    <!-- กล่องแสดงผู้แนะนำที่ล็อกไว้ -->
    <div class="p-3 bg-amber-500/10 border border-amber-400/30 rounded-2xl flex items-center justify-between text-xs">
      <div>
        <span class="text-[10px] text-amber-300 block">ผู้แนะนำของคุณ:</span>
        <b id="sponsorDisplay" class="text-white text-sm font-mono">กำลังตรวจสอบ...</b>
      </div>
      <span class="px-2 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]">Verified 🟢</span>
    </div>

    <form onsubmit="handleRegistration(event)" class="space-y-3.5 text-xs">
      <div>
        <label class="text-slate-400 block mb-1 font-semibold">ชื่อ - นามสกุล:</label>
        <input type="text" id="regName" placeholder="เช่น คุณสมชาย ใจดี" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 font-bold text-white focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="text-slate-400 block mb-1 font-semibold">เบอร์โทรศัพท์ (ใช้รับสิทธิ์):</label>
        <input type="tel" id="regPhone" placeholder="เช่น 0812345678" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 font-mono font-bold text-white focus:outline-none focus:border-amber-400">
      </div>

      <!-- กล่องข้อกำหนด PDPA -->
      <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5 text-[11px] text-slate-400">
        <label class="flex items-center gap-2 text-slate-300 font-bold">
          <input type="checkbox" id="acceptPdpa" checked required class="rounded text-amber-500">
          <span>ยินยอมตามนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA)</span>
        </label>
        <p class="text-[10px] text-slate-500">ข้อมูลของคุณจะได้รับการปกปิดด้วยระบบ Data Masking ตามเกณฑ์ ก.ล.ต.</p>
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl transition shadow-lg text-sm">
        ✓ ยืนยันการสมัครสมาชิก
      </button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref') || 'MEM-88899';
    document.getElementById('sponsorDisplay').innerText = `รหัส: ${refCode}`;

    function handleRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();

      alert(`🎉 ยินดีต้อนรับคุณ ${name}!\nสมัครสมาชิกสำเร็จโดยมีผู้แนะนำคือ ${refCode}\nคุณสามารถรับสิทธิประโยชน์และเปิดบัตรสมาชิกของคุณเองได้ทันที`);
      window.location.href = `member_card.html?code=MEM-${Math.floor(10000 + Math.random() * 90000)}`;
    }
  </script>
</body>
</html>

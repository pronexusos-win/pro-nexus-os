<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Smart Scanner - Pro Nexus Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .display-font { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex flex-col justify-between p-4">

  <!-- แถบด้านบน: เลือกบริษัท และสถานะผู้ใช้ -->
  <header class="max-w-md w-full mx-auto space-y-2 pt-2">
    <div class="flex items-center justify-between">
      <!-- ตัวสลับ 4 บริษัท -->
      <select id="companySelector" onchange="switchCompany(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-amber-400 font-bold px-3 py-1.5 rounded-xl">
        <option value="pro_nexus">🏢 บมจ. โปร เน็กซัส (HQ)</option>
        <option value="tp_extra">🏪 บริษัท ทีพี เอ็กซ์ตร้า จำกัด</option>
        <option value="partner_retail">🛍️ บริษัท พาร์ทเนอร์ รีเทล</option>
        <option value="health_supply">🌿 บริษัท เฮลท์ ซัพพลาย จำกัด</option>
      </select>

      <span id="scannerEngineBadge" class="text-[10px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-400">
        ตรวจสถานะ...
      </span>
    </div>

    <!-- แถบแสดงข้อมูลบัญชี LINE ที่ยืนยันแล้ว -->
    <div id="userInfoBar" class="hidden p-2 rounded-xl bg-slate-900/90 border border-emerald-500/30 flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>LINE: <b id="dspLineUser" class="text-emerald-300">--</b></span>
      </div>
      <button onclick="logoutAuth()" class="text-[10px] text-slate-400 hover:text-rose-400 underline">ออกจากระบบ</button>
    </div>
  </header>

  <!-- ม่านล็อกหน้าจอสำหรับเครื่องคอมพิวเตอร์ (PC LINE Login Gate) -->
  <div id="pcAuthGate" class="hidden max-w-md w-full mx-auto my-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
    <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 text-2xl flex items-center justify-center mx-auto">
      🔐
    </div>
    <div class="space-y-1">
      <h2 class="display-font text-base font-bold text-white">เข้าสู่ระบบด้วย LINE เพื่อเปิดกล้อง</h2>
      <p class="text-xs text-slate-400">ระบบทำงานบนคอมพิวเตอร์ กรุณาใช้สมาร์ทโฟนสแกนเพื่อเข้ารหัสยืนยันตัวตน</p>
    </div>

    <div class="bg-white p-3 rounded-2xl w-48 h-48 mx-auto shadow-inner border border-slate-300 flex items-center justify-center">
      <img id="pcAuthQrImg" src="" alt="LINE Auth QR" class="w-full h-full object-contain">
    </div>

    <div class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
      <span>กำลังรอการอนุมัติสิทธิ์จาก LINE...</span>
    </div>
  </div>

  <!-- ส่วนแสดงกล้องสแกน (เมื่อยืนยันตัวตนสำเร็จ) -->
  <main id="scannerMainUI" class="max-w-md w-full mx-auto space-y-4 my-auto">
    <!-- จอกล้อง WebRTC บนคอมฯ / เว็บเบราว์เซอร์ -->
    <div id="webCameraContainer" class="hidden rounded-3xl overflow-hidden border-2 border-amber-400/60 bg-black shadow-2xl">
      <div id="webReader" style="width: 100%; min-height: 250px;"></div>
      <p class="text-[11px] text-center text-slate-400 py-2 bg-slate-900">ส่องกล้องให้เห็นบาร์โค้ดหรือ QR Code ชัดเจน</p>
    </div>

    <div class="space-y-3">
      <button onclick="triggerUniversalScan()" id="btnMainScan" class="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black py-4 rounded-2xl transition shadow-xl text-base flex items-center justify-center gap-2">
        <span class="text-xl">📷</span>
        <span>แตะเพื่อเปิดกล้องสแกน</span>
      </button>

      <button onclick="toggleWebCamera()" id="btnWebFallback" class="w-full bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
        💻 สลับโหมดกล้องเว็บ / เว็บแคม PC
      </button>
    </div>

    <!-- กล่องแสดงผลลัพธ์การสแกน -->
    <div id="scanResultCard" class="hidden p-5 rounded-2xl border border-slate-800 bg-slate-900 space-y-3">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[10px] text-slate-400 uppercase block font-bold">รหัสที่ตรวจพบ:</span>
          <b id="resScannedCode" class="text-amber-400 font-mono text-base break-all"></b>
        </div>
        <span id="resActionType" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300"></span>
      </div>
      <div id="resActionDetails" class="text-xs text-slate-300 border-t border-slate-800 pt-2 space-y-1"></div>
      <div class="pt-1 flex gap-2">
        <button id="btnExecuteAction" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">
          ดำเนินการต่อ
        </button>
        <button onclick="triggerUniversalScan()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition">
          สแกนใหม่
        </button>
      </div>
    </div>
  </main>

  <footer class="text-center text-[10px] text-slate-500 pb-2">
    Multi-Tenant Camera Engine • บันทึกหลักฐาน Audit Trail ตามเกณฑ์ ITGC
  </footer>

  <script>
    const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:8000' : 'https://pro-nexus-os-production.up.railway.app';
    
    // ตั้งค่า LIFF ID ประจำแต่ละบริษัท (สามารถแยกกันได้ตามต้องการ)
    const COMPANY_LIFF_MAP = {
      "pro_nexus": "2011564874-MNIECumQ",
      "tp_extra": "2011564874-MNIECumQ", // ใส่ LIFF ID ของ TP Extra หรือใช้ตัวกลาง
      "partner_retail": "2011564874-MNIECumQ",
      "health_supply": "2011564874-MNIECumQ"
    };

    const urlParams = new URLSearchParams(window.location.search);
    let activeCompany = urlParams.get('company') || localStorage.getItem('active_company') || 'pro_nexus';
    let currentSessionToken = null;
    let pollTimer = null;
    let isLiffReady = false;
    let html5QrScanner = null;
    let isWebCamActive = false;

    document.getElementById('companySelector').value = activeCompany;

    function switchCompany(newCompany) {
      localStorage.setItem('active_company', newCompany);
      window.location.href = `scanner.html?company=${newCompany}`;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const badge = document.getElementById('scannerEngineBadge');
      const targetLiffId = COMPANY_LIFF_MAP[activeCompany] || COMPANY_LIFF_MAP["pro_nexus"];

      // 1. ตรวจสอบว่าเปิดผ่าน LINE App หรือไม่
      try {
        if (typeof liff !== 'undefined') {
          await liff.init({ liffId: targetLiffId });
          if (liff.isInClient()) {
            isLiffReady = true;
            const profile = await liff.getProfile();
            setAuthenticatedState(profile.displayName, profile.userId);
            badge.innerHTML = `🟢 LINE Scanner (${activeCompany})`;
            badge.className = "text-[10px] px-2.5 py-1 rounded-full bg-emerald-950 border border-emerald-700 text-emerald-300";

            // ถ้าเปิดเข้ามาเพื่อยืนยัน Session ให้คอมฯ
            const verifyToken = urlParams.get('auth_session');
            if (verifyToken) {
              await confirmPcSession(verifyToken, profile.userId, profile.displayName);
            }
            return;
          }
        }
      } catch (err) {
        console.warn("LIFF not in client, falling back to Web PC mode:", err);
      }

      // 2. ถ้าเปิดบนคอมฯ / เว็บเบราว์เซอร์ภายนอก
      badge.innerHTML = `🌐 Web Browser (${activeCompany})`;
      badge.className = "text-[10px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-700 text-amber-400";

      // ตรวจสอบว่าเคยยืนยันสิทธิ์ไว้ในเบราว์เซอร์นี้หรือยัง
      const savedUser = localStorage.getItem(`auth_user_${activeCompany}`);
      if (savedUser) {
        const u = JSON.parse(savedUser);
        setAuthenticatedState(u.display_name, u.line_user_id);
      } else {
        // บังคับแสดงหน้าจอ LINE QR Login บน PC
        initPcLoginGate();
      }
    });

    // เริ่มต้นระบบขอรหัส LINE Login ผ่าน QR บน PC
    async function initPcLoginGate() {
      document.getElementById('pcAuthGate').classList.remove('hidden');
      document.getElementById('scannerMainUI').classList.add('hidden');

      try {
        const res = await fetch(`${API_BASE}/api/v1/scanner-auth/create-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company_slug: activeCompany })
        });
        const data = await res.json();
        currentSessionToken = data.session_token;

        // ลิงก์ที่จะให้มือถือเปิด (วิ่งเข้า LINE เพื่อกดยืนยัน)
        const targetLiffId = COMPANY_LIFF_MAP[activeCompany];
        const authUrl = `https://liff.line.me/${targetLiffId}/admin/scanner.html?company=${activeCompany}&auth_session=${currentSessionToken}`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(authUrl)}`;
        document.getElementById('pcAuthQrImg').src = qrUrl;

        // เริ่มตรวจสอบว่ามือถือสแกนยืนยันหรือยัง
        startPollingSession(currentSessionToken);
      } catch (err) {
        console.error("Init PC login failed:", err);
      }
    }

    function startPollingSession(token) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/scanner-auth/check-session/${token}`);
          const data = await res.json();
          if (data.status === 'AUTHENTICATED') {
            clearInterval(pollTimer);
            localStorage.setItem(`auth_user_${activeCompany}`, JSON.stringify(data.user));
            setAuthenticatedState(data.user.display_name, data.user.line_user_id);
            document.getElementById('pcAuthGate').classList.add('hidden');
            document.getElementById('scannerMainUI').classList.remove('hidden');
          }
        } catch (e) {}
      }, 2000);
    }

    async function confirmPcSession(token, uid, name) {
      await fetch(`${API_BASE}/api/v1/scanner-auth/confirm-auth`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: token, line_user_id: uid, display_name: name })
      });
      alert("✅ อนุมัติสิทธิ์เข้าใช้งานบนหน้าจอคอมพิวเตอร์เรียบร้อยแล้ว!");
    }

    function setAuthenticatedState(displayName, uid) {
      document.getElementById('userInfoBar').classList.remove('hidden');
      document.getElementById('dspLineUser').innerText = displayName;
    }

    function logoutAuth() {
      localStorage.removeItem(`auth_user_${activeCompany}`);
      window.location.reload();
    }

    // การสั่งเปิดกล้องสแกน (Hybrid)
    async function triggerUniversalScan() {
      if (isLiffReady && liff.scanCodeV2) {
        try {
          const result = await liff.scanCodeV2();
          if (result && result.value) {
            handleScanSuccess(result.value);
            return;
          }
        } catch (err) {
          console.warn("LINE Scan cancel/error, switching to web cam:", err);
        }
      }
      toggleWebCamera(true);
    }

    function toggleWebCamera(forceOpen = false) {
      const container = document.getElementById('webCameraContainer');
      const btn = document.getElementById('btnWebFallback');

      if (isWebCamActive && !forceOpen) {
        if (html5QrScanner) {
          html5QrScanner.stop().then(() => {
            container.classList.add('hidden');
            btn.innerText = "💻 สลับโหมดกล้องเว็บ / เว็บแคม PC";
            isWebCamActive = false;
          });
        }
      } else {
        container.classList.remove('hidden');
        btn.innerText = "✕ ปิดกล้องเว็บ";
        isWebCamActive = true;

        html5QrScanner = new Html5Qrcode("webReader");
        html5QrScanner.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 260, height: 180 } },
          (code) => {
            handleScanSuccess(code);
            toggleWebCamera();
          },
          (err) => {}
        ).catch(e => {
          alert("ไม่สามารถเข้าถึงกล้อง/เว็บแคมได้ กรุณาอนุญาตสิทธิ์การใช้กล้อง");
          container.classList.add('hidden');
          isWebCamActive = false;
        });
      }
    }

    async function handleScanSuccess(rawCode) {
      if (window.navigator.vibrate) window.navigator.vibrate(100);
      const card = document.getElementById('scanResultCard');
      const txtCode = document.getElementById('resScannedCode');
      const txtType = document.getElementById('resActionType');
      const txtDetails = document.getElementById('resActionDetails');
      const btnExec = document.getElementById('btnExecuteAction');

      card.classList.remove('hidden');
      txtCode.innerText = rawCode;

      // ตรวจสอบสินค้าตาม company_slug ที่กำลังเลือกอยู่
      try {
        const res = await fetch(`${API_BASE}/api/v1/admin/inventory/pos-check-item`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ barcode_or_sku: rawCode, company_slug: activeCompany })
        });
        const data = await res.json();

        if (data.is_allowed) {
          txtType.innerText = `สินค้า (${activeCompany})`;
          txtDetails.innerHTML = `
            <b class="text-white block">${data.product_name}</b>
            <span class="text-amber-400 font-mono text-sm block">฿${data.price.toFixed(2)}</span>
            <span class="text-[11px] text-emerald-400">ล็อต: ${data.lot_no} (หมดอายุ: ${data.expiry_date})</span>
          `;
          btnExec.innerText = "ส่งยอดเข้าหน้าคิดเงิน POS ➔";
          btnExec.onclick = () => window.location.href = `pos.html?sku=${data.sku}&price=${data.price}&company=${activeCompany}`;
        } else {
          txtType.innerText = "แจ้งเตือนการสแกน";
          txtDetails.innerHTML = `<b class="text-rose-400">${data.block_reason || "รหัสนี้ไม่ตรงกับสต็อกของบริษัทที่เลือก"}</b>`;
          btnExec.innerText = "ปิดหน้าต่าง";
          btnExec.onclick = () => card.classList.add('hidden');
        }
      } catch (e) {
        txtDetails.innerText = "อ่านรหัสสำเร็จ แต่ไม่สามารถตรวจสอบสต็อกได้";
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ให้คะแนนและรีวิวสินค้า - Pro Nexus OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;700;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl">
    <div class="text-center space-y-1">
      <h1 class="text-lg font-bold text-white">⭐ ให้คะแนนและรีวิวความพึงพอใจ</h1>
      <p id="prodTitle" class="text-xs text-amber-400 font-mono">กำลังโหลดสินค้า...</p>
    </div>

    <form onsubmit="submitReview(event)" class="space-y-4 text-xs">
      <div>
        <label class="text-slate-400 block mb-1">คะแนนความพึงพอใจ:</label>
        <div class="flex gap-2 text-2xl cursor-pointer text-amber-400" id="starSelector">
          <span onclick="setRating(1)">★</span>
          <span onclick="setRating(2)">★</span>
          <span onclick="setRating(3)">★</span>
          <span onclick="setRating(4)">★</span>
          <span onclick="setRating(5)">★</span>
        </div>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">ชื่อผู้รีวิว (หรือนามสมมุติ):</label>
        <input type="text" id="custName" required placeholder="เช่น คุณสมชาย" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white">
      </div>
      <div>
        <label class="text-slate-400 block mb-1">ความเห็นจริงจากการใช้งาน:</label>
        <textarea id="commentText" required rows="3" placeholder="รสชาติเป็นอย่างไร / ใช้แล้วรู้สึกอย่างไร..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white"></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition text-sm">
        บันทึกรีวิวเพื่อส่งให้ AI ประมวลผล
      </button>
    </form>
  </div>

  <script>
    const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:8000' : 'https://pro-nexus-os-production.up.railway.app';
    const params = new URLSearchParams(window.location.search);
    const currentSku = params.get('sku') || 'FOOD-COFFEE-01';
    let selectedRating = 5;

    document.getElementById('prodTitle').innerText = `รหัสสินค้า: ${currentSku}`;

    function setRating(val) {
      selectedRating = val;
      const spans = document.querySelectorAll('#starSelector span');
      spans.forEach((s, idx) => {
        s.style.color = idx < val ? '#fbbf24' : '#475569';
      });
    }

    async function submitReview(e) {
      e.preventDefault();
      const payload = {
        sku: currentSku,
        customer_name: document.getElementById('custName').value.trim(),
        rating: selectedRating,
        comment: document.getElementById('commentText').value.trim()
      };

      const res = await fetch(`${API_BASE}/api/v1/admin/reviews/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        alert("ขอบคุณสำหรับรีวิว! AI ได้นำความคิดเห็นของคุณไปร่วมประมวลผลแล้ว");
        window.location.href = `scanner.html`;
      }
    }
    setRating(5);
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- พื้นหลังไล่เฉดสีฟ้าคนละครึ่ง / เป๋าตัง -->
    <linearGradient id="paoTangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4db"/>
      <stop offset="50%" stop-color="#0083b0"/>
      <stop offset="100%" stop-color="#0052d4"/>
    </linearGradient>

    <!-- แสงเลเซอร์สแกน -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffeb3b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff007f" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ffeb3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- พื้นหลังวงกลมมนเนียน สำหรับไอคอนโปรไฟล์ -->
  <rect width="512" height="512" rx="128" fill="url(#paoTangGrad)"/>

  <!-- กรอบเล็งกล้องสแกน 4 มุม สไตล์สแกนเนอร์คนละครึ่ง -->
  <!-- มุมบนซ้าย -->
  <path d="M 120 180 L 120 130 Q 120 120 130 120 L 180 120" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <!-- มุมบนขวา -->
  <path d="M 332 120 L 382 120 Q 392 120 392 130 L 392 180" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <!-- มุมล่างซ้าย -->
  <path d="M 120 332 L 120 382 Q 120 392 130 392 L 180 392" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <!-- มุมล่างขวา -->
  <path d="M 332 392 L 382 392 Q 392 392 392 382 L 392 332" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- สัญลักษณ์ QR Code ตรงกลาง -->
  <!-- กล่อง Finder บนซ้าย -->
  <rect x="165" y="165" width="60" height="60" rx="10" fill="#ffffff"/>
  <rect x="180" y="180" width="30" height="30" rx="4" fill="#0052d4"/>

  <!-- กล่อง Finder บนขวา -->
  <rect x="287" y="165" width="60" height="60" rx="10" fill="#ffffff"/>
  <rect x="302" y="180" width="30" height="30" rx="4" fill="#0052d4"/>

  <!-- กล่อง Finder ล่างซ้าย -->
  <rect x="165" y="287" width="60" height="60" rx="10" fill="#ffffff"/>
  <rect x="180" y="302" width="30" height="30" rx="4" fill="#0052d4"/>

  <!-- จุด QR Pixels เล็กๆ ตรงกลาง -->
  <rect x="246" y="175" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="246" y="215" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="246" y="255" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="287" y="255" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="327" y="287" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="287" y="327" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="327" y="327" width="20" height="20" rx="4" fill="#ffffff"/>

  <!-- เส้นเลเซอร์แนวนอนที่คนไทยคุ้นตา (เรืองแสงสีนีออน) -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="url(#laserGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
</svg>
